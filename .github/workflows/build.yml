name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Select Build Checks
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      planning: ${{ steps.scope.outputs.planning }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=""
          head="$GITHUB_SHA"
          if [[ "$EVENT" == push ]]; then
            base="$BEFORE"
          elif [[ "$EVENT" == pull_request ]]; then
            head="$PR_HEAD"
            base="$(git merge-base "$PR_BASE" "$PR_HEAD" || true)"
          fi
          bash scripts/ci-scope.sh "$base" "$head" >> "$GITHUB_OUTPUT"

  planning:
    name: Taskrail Validation
    needs: changes
    if: needs.changes.outputs.planning == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned toolchain
        uses: jdx/mise-action@v4
      - name: Validate planning and specs
        run: taskrail validate

  lint-and-typecheck:
    name: Linting and Type Checking
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run ruff checks
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check
      - name: Run mypy for type checking
        run: uv run mypy

  # Local policy and infrastructure guards have their own fast regression suites.
  guards:
    name: Policy and Infrastructure Guards
    needs: [changes, lint-and-typecheck]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned toolchain
        uses: jdx/mise-action@v4
      - name: Check CI scope selection
        run: bash scripts/check-ci-scope-test.sh
      - name: Check commit message policy
        run: bash scripts/check-commit-msg-test.sh
      - name: Check push message policy
        run: bash scripts/check-push-messages-test.sh
      - name: Check author identity policy
        run: bash scripts/check-author-test.sh
      - name: Check mutation result handling
        run: bash scripts/check-mutation-results-test.sh
      - name: Check mutation configuration
        run: bash scripts/check-mutation-config-test.sh
      - name: Check distribution inspection
        run: bash scripts/check-dist-test.sh
      - name: Check publish boundaries
        run: bash scripts/check-publish-guard-test.sh

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: [changes, lint-and-typecheck]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    # uv prefers .python-version over the interpreter setup-python puts on
    # PATH, so the matrix version is requested explicitly.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run unit tests
        run: uv run pytest -v tests/unit

  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    needs: [changes, unit-tests]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run integration tests
        run: uv run pytest -v tests/integration

  e2e-tests:
    name: E2E Tests (Python ${{ matrix.python-version }})
    needs: [changes, integration-tests]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run E2E tests
        run: uv run pytest -v tests/e2e

  package:
    name: Package (Python ${{ matrix.python-version }})
    needs: [changes, lint-and-typecheck]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check distributions
        run: bash scripts/check-dist.sh
      - name: Check installations
        run: bash scripts/check-install.sh "$(uv python find)"

  build-result:
    name: Build Result
    if: always()
    needs: [changes, planning, lint-and-typecheck, guards, unit-tests, integration-tests, e2e-tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .changes.result == "success" and
            (.changes.outputs.full | IN("true", "false")) and
            (.changes.outputs.planning | IN("true", "false")) and
            (if .changes.outputs.planning == "true"
             then .planning.result == "success"
             else .planning.result == "skipped" end) and
            ((if .changes.outputs.full == "true" then "success" else "skipped" end) as $expected
             | [."lint-and-typecheck", .guards, ."unit-tests", ."integration-tests", ."e2e-tests", .package]
             | all(.result == $expected))
          '
