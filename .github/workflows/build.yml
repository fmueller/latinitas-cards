name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Linting and Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
        id: setup-python
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
        id: cache-venv
      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
      - name: Run ruff checks
        run: poetry run ruff check
      - name: Check formatting
        run: poetry run ruff format --check
      - name: Run mypy for type checking
        run: poetry run mypy

  # The commit hooks are local and opt-in, so their own suites run here to keep
  # the message and authorship policy enforced even from a checkout without them.
  guards:
    name: Commit Policy Guards
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Check commit message policy
        run: bash scripts/check-commit-msg-test.sh
      - name: Check push message policy
        run: bash scripts/check-push-messages-test.sh
      - name: Check author identity policy
        run: bash scripts/check-author-test.sh

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
        id: setup-python
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
        id: cache-venv
      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
      - name: Run unit tests
        run: poetry run pytest -v
