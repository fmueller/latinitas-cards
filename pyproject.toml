[project]
name = "latinitas-cards"
version = "0.3.0"
description = "Turn Latin Anki decks or CSV exports into principal-part cards, with corpus cloze and grammar annotation tools."
authors = [{ name = "Felix Müller", email = "felix@fmueller.io" }]
requires-python = ">=3.13,<3.15"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "pydantic (>=2.11.9,<3.0.0)",
    "pandas>=2.3.3,<4.0.0",
    "rich>=13.9.4,<16.0.0",
    "click>=8.1,<8.6",
    "typer>=0.19.2,<0.28.0",
    "zstandard (>=0.25.0,<0.26.0)",
]

[project.urls]
Homepage = "https://github.com/fmueller/latinitas-cards"
Repository = "https://github.com/fmueller/latinitas-cards"
Changelog = "https://github.com/fmueller/latinitas-cards/blob/main/CHANGELOG.md"
Issues = "https://github.com/fmueller/latinitas-cards/issues"

[project.optional-dependencies]
# Experimental `annotate` command; pulls in Stanza and CPU-only PyTorch. torch is listed
# directly so uv can pick its index per extra; 2.9 is the first release with 3.14 wheels.
annotate = [
    "cltk[stanza] (>=2.5.1,<3.0.0)",
    "torch>=2.9",
]
# Highly experimental: `annotate` with CUDA PyTorch from PyPI.
annotate-gpu = [
    "cltk[stanza] (>=2.5.1,<3.0.0)",
    "torch>=2.9",
]

[project.scripts]
latinitas-cards = "latinitas_cards.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.19.1,<3",
    "ruff>=0.15.5,<0.18",
    "pytest>=9.0.2,<10",
    "pandas-stubs>=2.2,<4",
    "mutmut>=3.8.0,<4",
]

[tool.uv]
package = true
# CPU and CUDA PyTorch builds cannot share one environment.
conflicts = [[{ extra = "annotate" }, { extra = "annotate-gpu" }]]

[tool.uv.sources]
# macOS wheels on PyPI are already CPU-only; `annotate-gpu` uses PyPI's CUDA build.
torch = [{ index = "pytorch-cpu", extra = "annotate", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=77", "packaging>=24.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/latinitas_cards/"]
mutate_only_covered_lines = true
# Repository-file assertions run from inside mutmut's sandbox too.
also_copy = [
    "pyproject.toml",
    "mise.toml",
    "uv.lock",
    "README.md",
    "CHANGELOG.md",
    "THIRD_PARTY_NOTICES.md",
    "data/",
    "docs/",
    "planning/tasks/",
    ".agents/skills/extracting-authored-notes/",
    ".claude/skills/extracting-authored-notes/",
    "scripts/",
    "specs/",
    ".github/workflows/",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = "src/**/*.py,tests/**/*.py"
strict = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional `annotate` extra: untyped when installed, absent in default installs.
module = ["cltk", "cltk.*", "stanza", "stanza.*"]
ignore_missing_imports = true
